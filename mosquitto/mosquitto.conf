# Mosquitto MQTT Broker Configuration
# Charging Station System

# =============================================================================
# Listeners
# =============================================================================

# MQTT listener (для ESP32 и внутренних сервисов)
# 0.0.0.0 — принимаем подключения со всех интерфейсов.
# Станции (ESP32) подключаются напрямую на статический IP.
# Мост с 92.53.64.13 больше не используется (decommissioned 2026-05-02).
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener (опционально, для веб-клиентов)
listener 9001
protocol websockets

# =============================================================================
# TLS Listener (для продакшена - раскомментировать)
# =============================================================================

# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
# tls_version tlsv1.2

# =============================================================================
# Security
# =============================================================================

# Разрешить анонимные подключения (для начала)
# В продакшене рекомендуется настроить аутентификацию
allow_anonymous true

# Для продакшена раскомментировать и настроить:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# =============================================================================
# Persistence
# =============================================================================

persistence true
persistence_location /mosquitto/data/

# =============================================================================
# Logging
# =============================================================================

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# =============================================================================
# Connection settings (ОПТИМИЗАЦИЯ)
# =============================================================================

# Максимальный размер пакета (bytes)
message_size_limit 10240

# Keep-alive (уменьшено для быстрого обнаружения обрыва)
max_keepalive 60

# Очередь сообщений (увеличено для масштабирования)
max_queued_messages 5000

# Максимум inflight сообщений (для QoS 1/2)
max_inflight_messages 40

# Лимиты подключений (для масштабирования)
max_connections -1

# Повторная отправка QoS 1/2 сообщений (секунды)
retry_interval 10

